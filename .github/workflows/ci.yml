name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar shellcheck 0.10.0 (versión fija)
        run: |
          # Versión FIJA: 'apt-get install shellcheck' da 0.9.0, que no reporta
          # SC2034 ni SC2183 en los casos que nos interesan (falso verde).
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o /tmp/sc.tar.xz
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          chmod +x /usr/local/bin/shellcheck

      - name: shellcheck de todos los scripts
        run: |
          # -S warning: no rompemos por info/estilo, solo por problemas reales.
          # Los 'source' relativos no se siguen (los scripts son autocontenidos).
          shellcheck --version
          fail=0
          for f in ./*.sh ./.rd-setpass-root.sh; do
            echo "── $f"
            shellcheck -S warning -e SC1090,SC1091 "$f" || fail=1
          done
          exit $fail

  tests:
    name: tests.sh (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl make python3 python3-nacl

      - name: Tests de humo
        run: ./tests.sh

      - name: verify-docs
        run: ./verify-docs.sh || true   # requiere red; se informa, no bloquea

  sintaxis:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis de todos los scripts
        run: |
          for f in *.sh .rd-setpass-root.sh; do
            bash -n "$f" && echo "✔ $f" || exit 1
          done

  powershell-lint:
    name: PSScriptAnalyzer (windows/)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analizar los scripts del kit Windows
        shell: pwsh
        run: |
          # Severidad Error y Warning: no rompemos por mera información/estilo.
          # Se excluyen reglas de estilo y el uso de Write-Host (intencional
          # en herramientas de consola para el operador).
          $excl = @(
            'PSAvoidUsingWriteHost',
            'PSUseShouldProcessForStateChangingFunctions',
            'PSReviewUnusedParameter',
            # RustDesk exige la contraseña en texto plano por CLI
            # (--password); SecureString/PSCredential no sirven ahí.
            'PSAvoidUsingPlainTextForPassword'
          )
          $results = Invoke-ScriptAnalyzer `
            -Path .\windows `
            -Recurse `
            -Severity Error,Warning `
            -ExcludeRule $excl
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error ("PSScriptAnalyzer encontró {0} problema(s)" -f $results.Count)
            exit 1
          }
          Write-Host "✔ PSScriptAnalyzer sin hallazgos (Error/Warning)"

  windows-tests:
    name: tests-windows.ps1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas de humo del kit Windows
        shell: pwsh
        run: .\windows\tests-windows.ps1

  secrets:
    name: sin secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Buscar claves privadas y tokens
        run: |
          # Una clave privada o un token de Tailscale NUNCA deben entrar al repo.
          if grep -rIlE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' --exclude-dir=.git . ; then
            echo "::error::hay una clave privada en el repo"; exit 1
          fi
          # Las auth keys de Tailscale reales empiezan por 'tskey-auth-' y son
          # largas. Algunos literales de PRUEBA (en tests.sh y la doc) usan ese
          # prefijo a propósito para verificar el comportamiento del kit: no son
          # claves reales. Se excluyen por nombre para no dar falso positivo.
          #   tskey-auth-k1234     (placeholder de la doc)
          #   tskey-auth-SECRETO999XYZ / tskey-auth-TESTSTDIN (datos de test)
          if grep -rInE 'tskey-auth-[A-Za-z0-9]{10,}' --exclude-dir=.git . \
             | grep -vE 'tskey-auth-(k1234|SECRETO999XYZ|TESTSTDIN)' ; then
            echo "::error::hay una auth key de Tailscale en el repo"; exit 1
          fi
          echo "✔ sin claves privadas ni auth keys"
